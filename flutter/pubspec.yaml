name: stream_chat_ai_assistant_flutter_example
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.7.0
  # `stream_chat_flutter_ai` parses LaTeX but ships no math engine, so hosts
  # that don't render math don't pay for one. This is what lets
  # `StreamingMessageView.mathBuilder` typeset.
  flutter_math_fork: ^0.7.4
  marionette_flutter: ^0.6.0
  # Likewise for code fences: the package renders their chrome but ships no
  # grammars, since they dwarf the package itself. See lib/src/code_highlighter.dart.
  re_highlight: ^0.0.3
  stream_chat_flutter: ^10.0.1
  stream_chat_flutter_ai: ^0.1.0
  # Opens links the assistant puts in its replies.
  url_launcher: ^6.3.1
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true
