name: stream_chat_ai_assistant_flutter_example
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.7.0
  marionette_flutter: ^0.6.0
  stream_chat: ^10.0.1
  stream_chat_flutter: ^10.0.1
  stream_chat_flutter_ai:
    # Local path to a sibling checkout of github.com/GetStream/stream-chat-flutter.
    # Adjust this path (or switch to a version constraint) once the package is
    # published to pub.dev.
    path: ../../stream-chat-flutter-ai/packages/stream_chat_flutter_ai
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true
